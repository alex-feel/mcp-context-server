# Context Awareness Guidance Hook Configuration (Universal)
# This config controls the guidance shown at session start
# about checking recent context entries for session continuity.

# Whether the hook is enabled (optional, default: true)
enabled: true

# Guidance content configuration
guidance:
  # Header shown at the start of the message
  header: THREAD CONTEXT AWARENESS

  # Purpose explanation
  purpose: >-
    After a context compaction or a session resume you may have lost track of
    session state and of the original requirements. The user messages stored in
    the context server (source='user') state those requirements and outrank any
    summary, your own compacted recollection included; agent reports
    (source='agent') restore the state of prior work.

  # List of situations when checking context is recommended
  when_to_check:
    - After a compaction or a session resume, before continuing work
    - When you are unsure about recent work or session state, or the user asks about it
    - Before an action that depends on how the original requirements read

  # Instructions for how to check context
  how_to_check:
    description: >-
      Search the user messages first, then the agent reports, then read the
      relevant entries in full with get_context_by_ids, because search results
      are truncated previews.
    example: |-
      search_context(thread_id='thread-id', source='user', limit=10)
      search_context(thread_id='thread-id', source='agent', limit=10)
      get_context_by_ids(context_ids=[...])

  # List of things to look for when checking context
  what_to_look_for:
    - The original requirements, and the user's decisions and preferences from this session
    - Recent agent reports, their status, and entries with status pending, which mark interrupted work
    - Any place where an agent report or a task description departs from the user messages; the user messages win

  # Important boundaries to respect
  boundaries:
    - The check restores your own session awareness, so retrieve what the current work needs, most recent first, rather than loading everything

  # Emphasis message at the end
  emphasis: >-
    After any compaction or resume, do this recovery before continuing work:
    re-read the original user requirements and your own active plan or
    work-state by its preserved context_id.

  # Recovery steps after context compaction
  recovery_after_compaction:
    header: Recovery After Compaction
    steps:
      - Retrieve and read the user messages, then the agent reports, as described above
      - Re-read your own active plan or work-state by its preserved context_id; work you are doing yourself cannot resume without it
      - Continue from the last confirmed state, checked against the user messages and the re-read plan
