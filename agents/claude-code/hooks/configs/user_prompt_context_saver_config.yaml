# User Prompt Context Saver Hook Configuration
# This config controls which user prompts are saved to the context server.

# Whether the hook is enabled (optional, default: true)
enabled: true

# Whether to output stored context_id to model context via hookSpecificOutput.additionalContext
# When enabled, the hook outputs a JSON response with the context_id after successful storage,
# allowing the orchestrator to reference the exact user message by ID in agent prompts.
output_context_id: true

# Regex patterns to skip saving: prompts that are not the user's own words.
# Patterns match the START of the prompt text after leading whitespace is
# stripped. This shared list is synced to external consumers; a pattern for a
# hook or delivery path a given consumer does not use simply never matches
# there, which is harmless.
#
# Claude Code also submits turns it starts on the session's behalf, and the
# UserPromptSubmit hook input carries no field naming a turn's origin, so the
# start of the prompt text is the only signal a hook has. Claude Code wraps such
# content in a tag: <task-notification> for its own notifications (a Stop-hook
# wake among them), <cross-session-message ...> for a message from another
# Claude Code session, and <channel source="..."> for a channel-integration
# event. A message from another session or a subagent can instead be framed by
# a leading sentence ahead of the tagged content: "Another Claude session sent a
# message:" (or "... while you were working:") or "A peer session sent a
# message while you were working:". A peer message that arrives with neither a
# tag nor a framing sentence cannot be told apart from a typed prompt, so it is
# still stored, while a typed prompt that itself begins with one of these tags
# or sentences is not. Claude Code issue anthropics/claude-code#94675 asks for
# the missing origin field; the tag and framing patterns are needed only until
# the hook input carries it.
#
# The ^<bash-notification> pattern names a tag that Claude Code 2.1.280 does not
# emit, so it matches nothing on that release; it stays only until a live check
# settles whether any supported release emits it.
#
# When creating a `type: prompt` hook, add its prompt-prefix pattern here so the
# internal prompt is not saved as a user message. The same goes for the fixed
# prompt a scheduler sends to a headless session, such as the weekly
# harness-refinement run.
#
# Write patterns as plain scalars, where a regex backslash stays literal. Quote
# a pattern only when YAML requires it, such as the trailing space that keeps
# the channel pattern from matching longer tag names; inside double quotes every
# regex backslash must be doubled, because YAML reads "\b" as a backspace.
skip_patterns:
  - ^<task-notification>
  - ^<bash-notification>
  - ^<cross-session-message
  - "^<channel "
  - ^Another Claude session sent a message
  - ^A peer session sent a message
  - ^You are a fast, single-purpose tool-routing gate
  - "^/harness-refinement scheduled "

